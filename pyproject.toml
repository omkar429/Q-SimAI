[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "final"
version = "0.0.1"
description = "**SemantiQ** is an AI and Deep Learning-based system that determines whether two questions are semantically similar or different. It uses **NLP and Transformer-based models such as BERT/SBERT** to understand the meaning of question pairs and generate a similarity score. The system can be used for **duplicate question detection, e-learning platforms, question banks, and automated assessment systems**."
authors = [
  { name = "omkar kushawaha" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["final"]
include = ["pyproject.toml", "final/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["final"]
force-sort-within-sections = true

